<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main>
        <img class="icon" src="../Icon.png" width="96" height="96" alt="">
        <h1 data-ko="향수 최저가" data-en="Scent Price Finder"></h1>
        <p class="lead"
           data-ko="미국·영국·캐나다 향수 할인몰 30곳을 Safari에서 한 번에 검색하고, 원화 기준 최저가 순으로 보여주는 확장 프로그램이에요."
           data-en="A Safari extension that searches 30 US, UK and Canadian fragrance discounters at once and sorts results by the lowest price in KRW."></p>

        <!-- Mac: 확장 상태 -->
        <p class="status platform-mac state-on" data-ko="✓ Safari 확장이 켜져 있어요." data-en="✓ The Safari extension is on."></p>
        <p class="status platform-mac state-off warn" data-ko="Safari 확장이 꺼져 있어요. 아래 순서대로 켜주세요." data-en="The Safari extension is off. Turn it on with the steps below."></p>

        <section>
            <h2 data-ko="켜는 방법" data-en="Turn it on"></h2>
            <ol class="platform-mac">
                <li data-ko="아래 버튼으로 Safari 설정을 열어요." data-en="Open Safari Settings with the button below."></li>
                <li data-ko="확장 프로그램 탭에서 '향수 최저가'를 체크해요." data-en="In the Extensions tab, check “Scent Price Finder”."></li>
                <li data-ko="'웹사이트 편집'에서 쇼핑몰 사이트를 '허용'으로 바꿔요. (가격을 읽으려면 필요해요)" data-en="Under “Edit Websites”, set the store sites to “Allow” (needed to read prices)."></li>
            </ol>
            <ol class="platform-ios">
                <li data-ko="설정 › 앱 › Safari › 확장 프로그램으로 가요." data-en="Go to Settings › Apps › Safari › Extensions."></li>
                <li data-ko="'향수 최저가'를 켜요." data-en="Turn on “Scent Price Finder”."></li>
                <li data-ko="'기타 웹사이트'를 '허용'으로 바꿔요. (가격을 읽으려면 필요해요)" data-en="Set “Other Websites” to “Allow” (needed to read prices)."></li>
            </ol>
            <button class="platform-mac open-preferences" data-ko="Safari 설정 열기" data-en="Open Safari Settings"></button>
        </section>

        <section>
            <h2 data-ko="쓰는 방법" data-en="How to use"></h2>
            <ol>
                <li class="platform-mac" data-ko="Safari 툴바의 향수병 아이콘을 눌러요." data-en="Click the bottle icon in the Safari toolbar."></li>
                <li class="platform-ios" data-ko="Safari 주소창 왼쪽 메뉴 › 확장 프로그램 › 향수 최저가를 눌러요." data-en="In Safari, tap the menu left of the address bar › Extensions › Scent Price Finder."></li>
                <li data-ko="브랜드와 향수 이름을 영문으로 검색해요. 예: Xerjoff Naxos" data-en="Search by brand and fragrance name, e.g. Xerjoff Naxos."></li>
                <li data-ko="정품·테스터·언박스·샘플 필터와 용량, 정렬로 비교해요. 결과를 누르면 그 쇼핑몰에서 직접 구매해요." data-en="Compare with boxed/tester/unboxed/sample filters, size and sorting. Tap a result to buy directly from that store."></li>
            </ol>
        </section>

        <section class="note">
            <h2 data-ko="알아두세요" data-en="Good to know"></h2>
            <ul>
                <li data-ko="가격은 상품가 기준이에요. 배송비·관부가세는 포함하지 않아요." data-en="Prices are item prices only; shipping, duties and taxes are not included."></li>
                <li data-ko="검색어와 설정은 기기 안에만 저장되고 외부로 보내지 않아요." data-en="Searches and settings stay on your device and are never sent anywhere."></li>
                <li data-ko="이 앱은 쇼핑몰을 운영하거나 판매하지 않아요. 구매는 각 쇼핑몰에서 이뤄져요." data-en="This app does not sell anything; purchases happen on each store’s website."></li>
            </ul>
        </section>
    </main>
</body>
</html>
